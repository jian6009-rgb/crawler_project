<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>歌手列表</title>
</head>
<body>
    <h1>歌手列表页</h1>
    <a href="{% url 'artist_list' %}">
        打开歌曲列表
    </a>
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); margin: 0 auto;">
        {%for artist in artists%}
        <div style="display: flex;align-items: center; gap: 20px; margin:30px; flex-direction: column" >
            <a href = "{% url 'artist_detail' artist.id %}">
                <img style="border: 3px solid #000000 ; border-radius: 10px; box-shadow: 0 4px 10px #cccccc; object-fit: cover;"
                src="{{ artist.image_url }}"
                width="150" height="150">
            </a>
            <div>
                <a style="font-size: 24px; display: block; margin:20px; font-weight: bold;"  href = "{% url 'artist_detail' artist.id %}">{{ artist.name }}</a>
            </div>
        </div>
        {% endfor %}
    </div>


    <div style="font-size: 16px; display: block; margin:5px; font-weight: bold;text-align: center;">
        {%if artists.has_previous %}
        <a href = "?pageNo={{artists.previous_page_number}}">
            上一页：{{ artists.previous_page_number }}
        </a>
        {% endif %}
        <span>
                ( {{artists.number}} / {{artists.paginator.num_pages}} 页 )
        </span>
        {%if artists.has_next %}
        <a href = "?pageNo={{artists.next_page_number}}">
            下一页：{{ artists.next_page_number }}
        </a>
        {% endif %}
    </div>
</body>
</html>
